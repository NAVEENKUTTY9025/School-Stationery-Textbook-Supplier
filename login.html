<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Login to your EduSupplies account." />
    <title>Login | EduSupplies</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..900&display=swap" rel="stylesheet" />
    <style>
        /* ----- RESET & VARIABLES ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #FFFFFF;
            --bg-secondary: #F8FAFC;
            --text-main: #111111;
            --text-heading: #111111;
            --card-bg: #FFFFFF;
            --border-light: #E2E8F0;
            --royal: #2563EB;
            --deep: #111111;
            --white: #FFFFFF;
            --shadow: 0 20px 60px rgba(0,0,0,0.08);
            --input-bg: #F8FAFC;
        }
        [data-theme="dark"] {
            --bg-primary: #111111;
            --bg-secondary: #1E1E1E;
            --text-main: #EAEAEA;
            --text-heading: #FAFAFA;
            --card-bg: #222222;
            --border-light: #3A3A3A;
            --royal: #3B82F6;
            --deep: #000000;
            --white: #1E1E1E;
            --shadow: 0 20px 60px rgba(0,0,0,0.4);
            --input-bg: #2A2A2A;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
        }
        /* ----- NO SCROLL CONTAINER ----- */
        .login-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            transition: background 0.3s;
            overflow: hidden;
        }
        /* ----- TOP RIGHT TOGGLES (Dark Mode + RTL) ----- */
        .top-toggles {
            position: fixed;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .toggle-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 2px solid var(--border-light);
            color: var(--text-main);
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        .toggle-btn:hover {
            border-color: var(--royal);
            background: var(--royal);
            color: white;
            transform: scale(1.05);
        }
        .toggle-btn i {
            pointer-events: none;
        }

        /* ----- LOGIN CARD (centered, no scroll) ----- */
        .login-card {
            background: var(--card-bg);
            padding: 40px 36px 36px;
            border-radius: 32px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
            transition: background 0.3s, border 0.3s, box-shadow 0.3s;
            animation: fadeUp 0.6s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ----- BRAND HEADER (clickable logo) ----- */
        .brand-header {
            text-align: center;
            margin-bottom: 28px;
            cursor: pointer;
        }
        .brand-header .logo-icon {
            width: 56px;
            height: 56px;
            background: rgba(37,99,235,0.1);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--royal);
            font-size: 1.8rem;
            color: var(--royal);
            margin-bottom: 10px;
            transition: transform 0.3s;
        }
        .brand-header:hover .logo-icon {
            transform: scale(1.08);
        }
        .brand-header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-heading);
            letter-spacing: -0.02em;
        }
        .brand-header h1 span {
            color: var(--royal);
        }
        .brand-header .tagline {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-main);
            opacity: 0.5;
            font-weight: 500;
            margin-top: -2px;
        }

        /* ----- SIGN IN HEADER ----- */
        .signin-header {
            margin-bottom: 24px;
        }
        .signin-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-heading);
        }
        .signin-header p {
            font-size: 0.9rem;
            color: var(--text-main);
            opacity: 0.6;
            margin-top: 2px;
        }

        /* ----- FORM ----- */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .login-form .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .login-form label {
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-main);
            opacity: 0.7;
        }
        .login-form input {
            padding: 14px 18px;
            border-radius: 14px;
            border: 2px solid var(--border-light);
            background: var(--input-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: 0.2s;
            outline: none;
            width: 100%;
        }
        .login-form input:focus {
            border-color: var(--royal);
            box-shadow: 0 0 0 4px rgba(37,99,235,0.1);
        }
        .login-form input::placeholder {
            color: var(--text-main);
            opacity: 0.35;
        }

        .login-form .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin: 2px 0 2px;
        }
        .login-form .form-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0;
            cursor: pointer;
            opacity: 0.75;
            font-size: 0.85rem;
        }
        .login-form .form-options label input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: var(--royal);
            cursor: pointer;
            border-radius: 4px;
        }
        .login-form .form-options a {
            color: var(--royal);
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
            font-size: 0.85rem;
        }
        .login-form .form-options a:hover {
            text-decoration: underline;
        }

        .login-form .btn-login {
            padding: 15px;
            border-radius: 14px;
            border: none;
            background: var(--royal);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 4px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.02em;
        }
        .login-form .btn-login:hover {
            background: var(--deep);
            transform: scale(1.01);
            box-shadow: 0 12px 30px rgba(37,99,235,0.25);
        }

        /* ----- DIVIDER ----- */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 18px 0 16px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-light);
        }
        .divider span {
            font-size: 0.8rem;
            color: var(--text-main);
            opacity: 0.5;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            white-space: nowrap;
        }

        /* ----- SOCIAL BUTTONS (Google, Facebook, Apple with original logos) ----- */
        .social-buttons {
            display: flex;
            gap: 10px;
        }
        .social-buttons .btn-social {
            flex: 1;
            padding: 12px 8px;
            border-radius: 14px;
            border: 2px solid var(--border-light);
            background: transparent;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }
        .social-buttons .btn-social i {
            font-size: 1.3rem;
        }
        .social-buttons .btn-social:hover {
            border-color: var(--royal);
            background: rgba(37,99,235,0.05);
            transform: translateY(-2px);
        }
        /* Google brand color */
        .social-buttons .btn-social.google i {
            color: #EA4335;
        }
        .social-buttons .btn-social.google:hover {
            border-color: #EA4335;
            background: rgba(234,67,53,0.06);
        }
        /* Facebook brand color */
        .social-buttons .btn-social.facebook i {
            color: #1877F2;
        }
        .social-buttons .btn-social.facebook:hover {
            border-color: #1877F2;
            background: rgba(24,119,242,0.06);
        }
        /* Apple brand color */
        .social-buttons .btn-social.apple i {
            color: var(--text-main);
        }
        .social-buttons .btn-social.apple:hover {
            border-color: var(--text-main);
            background: rgba(0,0,0,0.04);
        }
        [data-theme="dark"] .social-buttons .btn-social.apple i {
            color: #FAFAFA;
        }
        [data-theme="dark"] .social-buttons .btn-social.apple:hover {
            background: rgba(255,255,255,0.06);
        }
        [data-theme="dark"] .social-buttons .btn-social:hover {
            background: rgba(59,130,246,0.12);
        }

        /* ----- REGISTER LINK ----- */
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--text-main);
            opacity: 0.7;
        }
        .register-link a {
            color: var(--royal);
            font-weight: 700;
            text-decoration: none;
            transition: 0.2s;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .register-link i {
            font-size: 0.8rem;
            margin-left: 4px;
        }

        /* ----- RTL OVERRIDES ----- */
        [dir="rtl"] .top-toggles {
            right: auto;
            left: 24px;
        }
        [dir="rtl"] .login-form .form-options {
            flex-direction: row-reverse;
        }
        [dir="rtl"] .register-link i {
            transform: scaleX(-1);
            margin-left: 0;
            margin-right: 4px;
        }
        [dir="rtl"] .social-buttons .btn-social i {
            margin-left: 0;
            margin-right: 6px;
        }

        /* ----- RESPONSIVE (still no scroll) ----- */
        @media (max-width: 460px) {
            .login-card {
                padding: 30px 20px 26px;
                max-width: 94%;
                border-radius: 24px;
            }
            .top-toggles {
                top: 16px;
                right: 16px;
                gap: 8px;
            }
            [dir="rtl"] .top-toggles {
                right: auto;
                left: 16px;
            }
            .toggle-btn {
                width: 38px;
                height: 38px;
                font-size: 0.95rem;
            }
            .brand-header h1 {
                font-size: 1.3rem;
            }
            .signin-header h2 {
                font-size: 1.25rem;
            }
            .login-form input {
                padding: 12px 14px;
                font-size: 0.9rem;
            }
            .social-buttons {
                gap: 8px;
            }
            .social-buttons .btn-social {
                font-size: 0.75rem;
                padding: 10px 6px;
            }
            .social-buttons .btn-social i {
                font-size: 1.1rem;
            }
        }
        @media (max-height: 620px) {
            .login-card {
                padding: 22px 24px 20px;
            }
            .brand-header {
                margin-bottom: 16px;
            }
            .brand-header .logo-icon {
                width: 42px;
                height: 42px;
                font-size: 1.3rem;
                margin-bottom: 6px;
            }
            .brand-header h1 {
                font-size: 1.2rem;
            }
            .signin-header {
                margin-bottom: 14px;
            }
            .signin-header h2 {
                font-size: 1.15rem;
            }
            .signin-header p {
                font-size: 0.8rem;
            }
            .login-form {
                gap: 10px;
            }
            .login-form input {
                padding: 10px 14px;
                font-size: 0.85rem;
            }
            .login-form .btn-login {
                padding: 11px;
                font-size: 0.9rem;
            }
            .divider {
                margin: 10px 0;
            }
            .social-buttons .btn-social {
                padding: 8px 6px;
                font-size: 0.75rem;
            }
            .social-buttons .btn-social i {
                font-size: 1rem;
            }
            .register-link {
                margin-top: 12px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

<!-- ===== TOP RIGHT TOGGLES (Dark Mode + RTL) ===== -->
<div class="top-toggles">
    <button class="toggle-btn" id="themeToggle" aria-label="Toggle theme">
        <i class="fas fa-moon" id="themeIcon"></i>
    </button>
    <button class="toggle-btn" id="rtlToggle" aria-label="Toggle RTL">
        <i class="fas fa-right-left"></i>
    </button>
</div>

<!-- ===== LOGIN WRAPPER (no scroll) ===== -->
<div class="login-wrapper">
    <div class="login-card">
        <!-- Brand Header (clickable logo → index.html) -->
        <a href="index.html" style="text-decoration:none; display:block;">
            <div class="brand-header">
                <div class="logo-icon"><i class="fas fa-book-open"></i></div>
                <h1>Edu<span>Supplies</span></h1>
                <div class="tagline">learn &amp; grow</div>
            </div>
        </a>

        <!-- Sign In Header -->
        <div class="signin-header">
            <h2>Sign In</h2>
            <p>Welcome back &bull; Enter your credentials</p>
        </div>

        <!-- Login Form -->
        <form class="login-form" onsubmit="event.preventDefault(); alert('Login functionality would be handled here.');">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" value="you@example.com" required />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required />
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" checked /> Remember this device
                </label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-arrow-right-to-bracket" style="margin-right:8px;"></i> Sign In
            </button>
        </form>

        <!-- Divider -->
        <div class="divider">
            <span>Connect with</span>
        </div>

        <!-- Social Buttons (Google, Facebook, Apple with original logos) -->
        <div class="social-buttons">
            <button class="btn-social google" onclick="alert('Google sign-in would be handled here.')">
                <i class="fab fa-google"></i> Google
            </button>
            <button class="btn-social facebook" onclick="alert('Facebook sign-in would be handled here.')">
                <i class="fab fa-facebook-f"></i> Facebook
            </button>
            <button class="btn-social apple" onclick="alert('Apple sign-in would be handled here.')">
                <i class="fab fa-apple"></i> Apple
            </button>
        </div>

        <!-- Register Link -->
        <div class="register-link">
            <a href="register.html">+ Create account</a>
        </div>
    </div>
</div>

<script>
    (function() {
        const html = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const rtlToggle = document.getElementById('rtlToggle');

        // ----- THEME -----
        let currentTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', currentTheme);
        updateThemeIcon(currentTheme);

        function updateThemeIcon(theme) {
            if (theme === 'dark') {
                themeIcon.className = 'fas fa-sun';
            } else {
                themeIcon.className = 'fas fa-moon';
            }
        }

        themeToggle.addEventListener('click', function() {
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        // ----- RTL -----
        let currentDir = localStorage.getItem('direction') || 'ltr';
        html.setAttribute('dir', currentDir);

        rtlToggle.addEventListener('click', function() {
            const dir = html.getAttribute('dir') === 'rtl' ? 'ltr' : 'rtl';
            html.setAttribute('dir', dir);
            localStorage.setItem('direction', dir);
        });

        // ----- ENSURE NO SCROLL -----
        document.body.style.overflow = 'hidden';
        document.documentElement.style.overflow = 'hidden';

        const wrapper = document.querySelector('.login-wrapper');
        wrapper.addEventListener('wheel', function(e) {
            e.preventDefault();
        }, { passive: false });

        wrapper.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('keydown', function(e) {
            const keys = ['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', ' ', 'Space'];
            if (keys.includes(e.key) || e.key === ' ') {
                e.preventDefault();
            }
        });

        console.log('✅ Login page loaded — no scroll allowed.');
    })();
</script>
</body>
</html>
