<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | EduSupplies</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #FFFFFF;
            --text-main: #111111;
            --royal: #2563EB;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* no scroll */
            text-align: center;
            position: relative;
        }
        .bg-pattern {
            position: absolute;
            inset: 0;
            opacity: 0.04;
            pointer-events: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22 width=%2240%22 height=%2240%22><path fill=%22%232563EB%22 d=%22M0 0 L40 40 M40 0 L0 40%22 stroke-width=%221%22 stroke=%22%23111111%22 opacity=%220.3%22 /></svg>');
        }
        .error-container {
            z-index: 10;
            padding: 2rem;
            max-width: 600px;
            animation: fadeInUp 0.7s ease forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-code {
            font-size: 10rem;
            font-weight: 900;
            color: var(--royal);
            line-height: 1;
            margin-bottom: 1rem;
            text-shadow: 0 10px 30px rgba(37,99,235,0.2);
            letter-spacing: -5px;
        }
        .error-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
        }
        .error-text {
            font-size: 1.125rem;
            opacity: 0.8;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background-color: var(--royal);
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 1.125rem;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 2px solid var(--royal);
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
        }
        .btn-home:hover {
            background-color: transparent;
            color: var(--royal);
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -5px rgba(37, 99, 235, 0.2);
        }
        @media (max-width: 768px) {
            .error-code { font-size: 7rem; }
            .error-title { font-size: 2rem; }
            .error-text { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Oops! Page not found.</h1>
        <p class="error-text">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="index.html" class="btn-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
</body>
</html>
