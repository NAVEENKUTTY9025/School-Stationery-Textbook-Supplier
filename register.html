<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your EduSupplies account." />
    <title>Register | EduSupplies</title>
    <link rel="icon" type="image/jpeg" href="/images/edu-favicon.jpg" />
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..900&display=swap" rel="stylesheet" />
    <style>
        /* ----- RESET & VARIABLES ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #FFFFFF;
            --bg-secondary: #F8FAFC;
            --text-main: #111111;
            --text-heading: #111111;
            --card-bg: #FFFFFF;
            --border-light: #E2E8F0;
            --royal: #2563EB;
            --deep: #111111;
            --shadow: 0 20px 60px rgba(0,0,0,0.08);
            --input-bg: #F8FAFC;
        }
        [data-theme="dark"] {
            --bg-primary: #111111;
            --bg-secondary: #1E1E1E;
            --text-main: #EAEAEA;
            --text-heading: #FAFAFA;
            --card-bg: #222222;
            --border-light: #3A3A3A;
            --royal: #3B82F6;
            --deep: #000000;
            --shadow: 0 20px 60px rgba(0,0,0,0.4);
            --input-bg: #2A2A2A;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
        }
        /* ----- NO SCROLL CONTAINER ----- */
        .register-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            transition: background 0.3s;
            overflow: hidden;
        }
        /* ----- TOP RIGHT TOGGLES (Dark Mode + RTL) ----- */
        .top-toggles {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }
        .toggle-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 2px solid var(--border-light);
            color: var(--text-main);
            font-size: 1rem;
            cursor: pointer;
            transition: 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        .toggle-btn:hover {
            border-color: var(--royal);
            background: var(--royal);
            color: white;
            transform: scale(1.05);
        }
        .toggle-btn i {
            pointer-events: none;
        }

        /* ----- REGISTER CARD (centered, tightened) ----- */
        .register-card {
            background: var(--card-bg);
            padding: 24px 28px 22px;
            border-radius: 24px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 380px;
            transition: background 0.3s, border 0.3s, box-shadow 0.3s;
            animation: fadeUp 0.6s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ----- BRAND HEADER (tightened) ----- */
        .brand-header {
            text-align: center;
            margin-bottom: 16px;
            cursor: pointer;
        }
        .brand-header .logo-icon {
            width: 44px;
            height: 44px;
            background: rgba(37,99,235,0.1);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--royal);
            font-size: 1.4rem;
            color: var(--royal);
            margin-bottom: 4px;
            transition: transform 0.3s;
        }
        .brand-header:hover .logo-icon {
            transform: scale(1.08);
        }
        .brand-header h1 {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-heading);
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        .brand-header h1 span {
            color: var(--royal);
        }
        .brand-header .tagline {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-main);
            opacity: 0.5;
            font-weight: 500;
            margin-top: -2px;
        }

        /* ----- REGISTER HEADER (tightened) ----- */
        .register-header {
            margin-bottom: 14px;
        }
        .register-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-heading);
            line-height: 1.2;
        }
        .register-header p {
            font-size: 0.8rem;
            color: var(--text-main);
            opacity: 0.6;
            margin-top: 0px;
        }

        /* ----- FORM (tightened) ----- */
        .register-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .register-form .form-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .register-form label {
            font-weight: 600;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-main);
            opacity: 0.7;
        }
        .register-form input {
            padding: 9px 12px;
            border-radius: 10px;
            border: 2px solid var(--border-light);
            background: var(--input-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: 0.2s;
            outline: none;
            width: 100%;
        }
        .register-form input:focus {
            border-color: var(--royal);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .register-form input::placeholder {
            color: var(--text-main);
            opacity: 0.35;
        }

        .register-form .form-options {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            margin: 2px 0 1px;
        }
        .register-form .form-options label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0;
            cursor: pointer;
            opacity: 0.75;
            font-size: 0.75rem;
        }
        .register-form .form-options label input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: var(--royal);
            cursor: pointer;
            border-radius: 3px;
        }
        .register-form .form-options a {
            color: var(--royal);
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
            font-size: 0.75rem;
        }
        .register-form .form-options a:hover {
            text-decoration: underline;
        }

        .register-form .btn-register {
            padding: 11px;
            border-radius: 10px;
            border: none;
            background: var(--royal);
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 2px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.02em;
        }
        .register-form .btn-register:hover {
            background: var(--deep);
            transform: scale(1.01);
            box-shadow: 0 8px 25px rgba(37,99,235,0.25);
        }

        /* ----- DIVIDER (tightened) ----- */
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 12px 0 10px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-light);
        }
        .divider span {
            font-size: 0.65rem;
            color: var(--text-main);
            opacity: 0.5;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            white-space: nowrap;
        }

        /* ----- SOCIAL BUTTONS (tightened) ----- */
        .social-buttons {
            display: flex;
            gap: 6px;
        }
        .social-buttons .btn-social {
            flex: 1;
            padding: 8px 4px;
            border-radius: 10px;
            border: 2px solid var(--border-light);
            background: transparent;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-family: 'Inter', sans-serif;
        }
        .social-buttons .btn-social i {
            font-size: 1.1rem;
        }
        .social-buttons .btn-social:hover {
            border-color: var(--royal);
            background: rgba(37,99,235,0.05);
            transform: translateY(-2px);
        }
        .social-buttons .btn-social.google i {
            color: #EA4335;
        }
        .social-buttons .btn-social.google:hover {
            border-color: #EA4335;
            background: rgba(234,67,53,0.06);
        }
        .social-buttons .btn-social.facebook i {
            color: #1877F2;
        }
        .social-buttons .btn-social.facebook:hover {
            border-color: #1877F2;
            background: rgba(24,119,242,0.06);
        }
        .social-buttons .btn-social.apple i {
            color: var(--text-main);
        }
        .social-buttons .btn-social.apple:hover {
            border-color: var(--text-main);
            background: rgba(0,0,0,0.04);
        }
        [data-theme="dark"] .social-buttons .btn-social.apple i {
            color: #FAFAFA;
        }
        [data-theme="dark"] .social-buttons .btn-social.apple:hover {
            background: rgba(255,255,255,0.06);
        }
        [data-theme="dark"] .social-buttons .btn-social:hover {
            background: rgba(59,130,246,0.12);
        }

        /* ----- LOGIN LINK (tightened) ----- */
        .login-link {
            text-align: center;
            margin-top: 12px;
            font-size: 0.8rem;
            color: var(--text-main);
            opacity: 0.7;
        }
        .login-link a {
            color: var(--royal);
            font-weight: 700;
            text-decoration: none;
            transition: 0.2s;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .login-link i {
            font-size: 0.7rem;
            margin-left: 3px;
        }

        /* ----- RTL OVERRIDES ----- */
        [dir="rtl"] .top-toggles {
            right: auto;
            left: 20px;
        }
        [dir="rtl"] .register-form .form-options {
            flex-direction: row-reverse;
        }
        [dir="rtl"] .login-link i {
            transform: scaleX(-1);
            margin-left: 0;
            margin-right: 3px;
        }
        [dir="rtl"] .social-buttons .btn-social i {
            margin-left: 0;
            margin-right: 5px;
        }

        /* ----- RESPONSIVE (no scroll) ----- */
        @media (max-width: 460px) {
            .register-card {
                padding: 20px 16px 18px;
                max-width: 94%;
                border-radius: 20px;
            }
            .top-toggles {
                top: 12px;
                right: 12px;
                gap: 6px;
            }
            [dir="rtl"] .top-toggles {
                right: auto;
                left: 12px;
            }
            .toggle-btn {
                width: 34px;
                height: 34px;
                font-size: 0.85rem;
            }
            .brand-header .logo-icon {
                width: 36px;
                height: 36px;
                font-size: 1.1rem;
            }
            .brand-header h1 {
                font-size: 1.1rem;
            }
            .register-header h2 {
                font-size: 1.05rem;
            }
            .register-form input {
                padding: 8px 10px;
                font-size: 0.8rem;
            }
            .register-form .btn-register {
                padding: 9px;
                font-size: 0.85rem;
            }
            .social-buttons .btn-social {
                font-size: 0.65rem;
                padding: 6px 3px;
            }
            .social-buttons .btn-social i {
                font-size: 0.95rem;
            }
        }
        @media (max-height: 650px) {
            .register-card {
                padding: 16px 18px 14px;
                border-radius: 18px;
            }
            .brand-header {
                margin-bottom: 10px;
            }
            .brand-header .logo-icon {
                width: 32px;
                height: 32px;
                font-size: 0.95rem;
                border-radius: 10px;
                margin-bottom: 2px;
            }
            .brand-header h1 {
                font-size: 1rem;
            }
            .brand-header .tagline {
                font-size: 0.45rem;
            }
            .register-header {
                margin-bottom: 8px;
            }
            .register-header h2 {
                font-size: 0.95rem;
            }
            .register-header p {
                font-size: 0.7rem;
            }
            .register-form {
                gap: 5px;
            }
            .register-form input {
                padding: 6px 10px;
                font-size: 0.75rem;
                border-radius: 8px;
            }
            .register-form label {
                font-size: 0.55rem;
            }
            .register-form .btn-register {
                padding: 7px;
                font-size: 0.8rem;
                border-radius: 8px;
            }
            .register-form .form-options {
                font-size: 0.65rem;
                margin: 0;
            }
            .register-form .form-options label {
                font-size: 0.65rem;
            }
            .register-form .form-options label input[type="checkbox"] {
                width: 13px;
                height: 13px;
            }
            .divider {
                margin: 8px 0 6px;
                gap: 8px;
            }
            .divider span {
                font-size: 0.55rem;
            }
            .social-buttons .btn-social {
                padding: 5px 3px;
                font-size: 0.6rem;
                border-radius: 8px;
            }
            .social-buttons .btn-social i {
                font-size: 0.85rem;
            }
            .login-link {
                margin-top: 8px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

<!-- ===== TOP RIGHT TOGGLES ===== -->
<div class="top-toggles">
    <button class="toggle-btn" id="themeToggle" aria-label="Toggle theme">
        <i class="fas fa-moon" id="themeIcon"></i>
    </button>
    <button class="toggle-btn" id="rtlToggle" aria-label="Toggle RTL">
        <i class="fas fa-right-left"></i>
    </button>
</div>

<!-- ===== REGISTER WRAPPER (no scroll) ===== -->
<div class="register-wrapper">
    <div class="register-card">
        <!-- Brand Header (clickable) -->
        <a href="index.html" style="text-decoration:none; display:block;">
            <div class="brand-header">
                <div class="logo-icon"><i class="fas fa-book-open"></i></div>
                <h1>Edu<span>Supplies</span></h1>
                <div class="tagline">learn &amp; grow</div>
            </div>
        </a>

        <!-- Register Header -->
        <div class="register-header">
            <h2>Create Account</h2>
            <p>Join us &bull; Start learning today</p>
        </div>

        <!-- Register Form -->
        <form class="register-form" onsubmit="event.preventDefault(); alert('Registration would be handled here.');">
            <div class="form-group">
                <label for="firstName">First name</label>
                <input type="text" id="firstName" placeholder="John" required />
            </div>
            <div class="form-group">
                <label for="lastName">Last name</label>
                <input type="text" id="lastName" placeholder="Doe" required />
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required />
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" required />
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" checked /> I agree to the <a href="#">Terms</a> &amp; <a href="#">Privacy</a>
                </label>
            </div>

            <button type="submit" class="btn-register">
                <i class="fas fa-user-plus" style="margin-right:6px;"></i> Create Account
            </button>
        </form>

        <!-- Divider -->
        <div class="divider">
            <span>Connect with</span>
        </div>

        <!-- Social Buttons -->
        <div class="social-buttons">
            <button class="btn-social google" onclick="alert('Google sign-up would be handled here.')">
                <i class="fab fa-google"></i> Google
            </button>
            <button class="btn-social facebook" onclick="alert('Facebook sign-up would be handled here.')">
                <i class="fab fa-facebook-f"></i> Facebook
            </button>
            <button class="btn-social apple" onclick="alert('Apple sign-up would be handled here.')">
                <i class="fab fa-apple"></i> Apple
            </button>
        </div>

        <!-- Login Link -->
        <div class="login-link">
            Already have an account? <a href="login.html">Sign in <i class="fas fa-arrow-right"></i></a>
        </div>
    </div>
</div>

<script>
    (function() {
        const html = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const rtlToggle = document.getElementById('rtlToggle');

        // ----- THEME -----
        let currentTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', currentTheme);
        updateThemeIcon(currentTheme);

        function updateThemeIcon(theme) {
            themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        themeToggle.addEventListener('click', function() {
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        // ----- RTL -----
        let currentDir = localStorage.getItem('direction') || 'ltr';
        html.setAttribute('dir', currentDir);

        rtlToggle.addEventListener('click', function() {
            const dir = html.getAttribute('dir') === 'rtl' ? 'ltr' : 'rtl';
            html.setAttribute('dir', dir);
            localStorage.setItem('direction', dir);
        });

        // ----- ENSURE NO SCROLL -----
        document.body.style.overflow = 'hidden';
        document.documentElement.style.overflow = 'hidden';

        const wrapper = document.querySelector('.register-wrapper');
        wrapper.addEventListener('wheel', function(e) { e.preventDefault(); }, { passive: false });
        wrapper.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

        window.addEventListener('keydown', function(e) {
            const keys = ['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', ' ', 'Space'];
            if (keys.includes(e.key) || e.key === ' ') e.preventDefault();
        });

        // Password match validation
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');

        function validatePasswordMatch() {
            if (password.value && confirmPassword.value && password.value !== confirmPassword.value) {
                confirmPassword.style.borderColor = '#EF4444';
            } else {
                confirmPassword.style.borderColor = 'var(--border-light)';
            }
        }
        password.addEventListener('input', validatePasswordMatch);
        confirmPassword.addEventListener('input', validatePasswordMatch);
    })();
</script>
</body>
</html>
